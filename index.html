<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pruebas Objetivas · Administración</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
:root{--bg:#f6f7fb;--panel:#fff;--fg:#14182b;--muted:#5d6580;--line:#dfe3ee;--accent:#2b3fd6;--accent-fg:#fff;--accent-soft:#e8ebff;--ok:#0e7a4b;--ok-soft:#e1f5ec;--warn:#9a5b00;--warn-soft:#fff1d6;--bad:#b3261e;--bad-soft:#fde7e5;--radius:10px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1220;--panel:#171b2e;--fg:#e8eaf6;--muted:#9aa2c4;--line:#2a3050;--accent:#7b8cff;--accent-fg:#0f1220;--accent-soft:#222a55;--ok:#5bd69a;--ok-soft:#133526;--warn:#f0b254;--warn-soft:#3a2b10;--bad:#ff8a80;--bad-soft:#3d1a18;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1220;--panel:#171b2e;--fg:#e8eaf6;--muted:#9aa2c4;--line:#2a3050;--accent:#7b8cff;--accent-fg:#0f1220;--accent-soft:#222a55;--ok:#5bd69a;--ok-soft:#133526;--warn:#f0b254;--warn-soft:#3a2b10;--bad:#ff8a80;--bad-soft:#3d1a18;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:'Space Grotesk',Inter,sans-serif;margin:0;text-wrap:balance}
h2{font-size:22px}h3{font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn.sec{background:var(--panel);color:var(--fg);border:1px solid var(--line)}
.btn.bad{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{font-family:ui-monospace,Consolas,monospace;font-size:14px;min-height:170px}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
.field{margin-bottom:12px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1 1 180px;min-width:0}.row>.btn,.row>.auto{flex:0 0 auto}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{background:var(--panel);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px}
nav .brand{font:700 17px 'Space Grotesk';padding:4px 10px 12px;color:var(--accent)}
nav a{padding:8px 10px;border-radius:8px;color:var(--fg);text-decoration:none;cursor:pointer}
nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav .sp{flex:1}
main{padding:24px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px));max-width:980px;width:100%}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:16px 0}
.card>h3{margin-bottom:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tw{overflow-x:auto}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.muted{color:var(--muted)}
.msg{padding:9px 12px;border-radius:8px;margin:10px 0;font-size:14px}
.msg.ok{background:var(--ok-soft);color:var(--ok)}.msg.err{background:var(--bad-soft);color:var(--bad)}.msg.warn{background:var(--warn-soft);color:var(--warn)}
.login{max-width:380px;margin:12vh auto;padding:0 16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.toggle{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.toggle input{width:auto;margin-top:4px}
.toggle label{margin:0;color:var(--fg);font-weight:500}
.hd-mobile{display:none}
@media (max-width:760px){.shell{grid-template-columns:1fr}nav{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}nav .brand{width:100%}nav .sp{display:none}}
</style>
</head>
<body><div id="app"></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body></html>
